{% extends "base.html" %}

{% block title %}Error — FitBuddy{% endblock %}

{% block content %}
<div class="container container-narrow">
  <div class="card" style="text-align: center; padding: 3.5rem 2rem; max-width: 540px; margin: 3rem auto; box-shadow: var(--shadow-lg);">
    <div style="width: 4rem; height: 4rem; border-radius: 50%; background-color: var(--danger-light); color: var(--danger); margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 1.75rem;">
      ⚠️
    </div>

    <h2 style="margin-bottom: 0.5rem; color: var(--text-main);">We Encountered an Issue</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.75rem;">
      {{ error_message or "The requested resource could not be found or processed." }}
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center;">
      <a href="/dashboard" class="btn btn-primary">Return to Dashboard</a>
      <a href="/" class="btn btn-secondary">Home</a>
    </div>
  </div>
</div>
{% endblock %}
